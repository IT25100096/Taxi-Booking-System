<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Vehicle Safety Checklist | Taxi Booking System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#fefce8', 100: '#fef9c3', 500: '#eab308', 600: '#ca8a04', 900: '#713f12' },
                        dark: { 800: '#121212', 900: '#0a0a0a' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background: #0a0a0a; min-height: 100vh; color: #fff; }
        .glass-panel { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 1.5rem; }
        .checklist-item { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .checklist-item:hover { transform: translateX(8px); background: rgba(234, 179, 8, 0.05); }
        .checkbox-custom { accent-color: #eab308; width: 1.5rem; height: 1.5rem; cursor: pointer; transition: transform 0.2s; }
        .checkbox-custom:active { transform: scale(0.9); }
        .submit-btn { transition: all 0.3s ease; }
        .submit-btn:hover { box-shadow: 0 0 20px rgba(234, 179, 8, 0.3); transform: translateY(-2px); }
    </style>
</head>
<body class="flex items-center justify-center p-6">

<div class="glass-panel w-full max-w-2xl p-8 shadow-2xl relative overflow-hidden border border-neutral-800">
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-brand-500 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-pulse"></div>
    <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-amber-600 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-pulse" style="animation-delay: 2s;"></div>

    <div class="relative z-10">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-amber-300 to-yellow-500 mb-2">Pre-Shift Safety Check</h1>
            <p class="text-neutral-400">Please verify the health of your vehicle before starting your shift.</p>
        </div>

        <form id="healthReportForm" class="space-y-6">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div>
                    <label class="block text-sm font-medium text-neutral-300 mb-2">Vehicle ID</label>
                    <input type="text" required class="w-full bg-dark-800 border border-neutral-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-colors" placeholder="e.g. V-1024">
                </div>
                <div>
                    <label class="block text-sm font-medium text-neutral-300 mb-2">Date</label>
                    <input type="date" required class="w-full bg-dark-800 border border-neutral-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-colors">
                </div>
            </div>

            <div class="space-y-4 bg-dark-800/40 p-6 rounded-xl border border-neutral-800/80">
                <h3 class="text-lg font-semibold text-brand-400 mb-4 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    System Checklist
                </h3>

                <label class="checklist-item flex items-center p-3 rounded-lg cursor-pointer">
                    <input type="checkbox" required class="checkbox-custom mr-4">
                    <span class="text-neutral-300 text-lg">Headlights, Taillights & Signals functional</span>
                </label>

                <label class="checklist-item flex items-center p-3 rounded-lg cursor-pointer">
                    <input type="checkbox" required class="checkbox-custom mr-4">
                    <span class="text-neutral-300 text-lg">Tire pressure & tread depth optimal</span>
                </label>

                <label class="checklist-item flex items-center p-3 rounded-lg cursor-pointer">
                    <input type="checkbox" required class="checkbox-custom mr-4">
                    <span class="text-neutral-300 text-lg">Brake responsiveness is normal</span>
                </label>

                <label class="checklist-item flex items-center p-3 rounded-lg cursor-pointer">
                    <input type="checkbox" required class="checkbox-custom mr-4">
                    <span class="text-neutral-300 text-lg">No warning lights on dashboard</span>
                </label>
            </div>

            <div class="mt-8">
                <label class="block text-sm font-medium text-neutral-300 mb-2">Report Any Issues (Optional)</label>
                <textarea rows="3" class="w-full bg-dark-800 border border-neutral-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-colors" placeholder="Describe any strange noises, vibrations, etc."></textarea>
            </div>

            <button type="submit" class="submit-btn w-full mt-8 bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-500 hover:to-amber-400 text-black font-bold py-4 px-6 rounded-xl text-lg flex justify-center items-center">
                Submit Health Report
                <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </form>
    </div>
</div>

<script>
    document.getElementById('healthReportForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const originalText = btn.innerHTML;
        btn.innerHTML = `<svg class="animate-spin h-5 w-5 mr-3 text-black" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Processing...`;

        setTimeout(() => {
            btn.classList.remove('from-brand-600', 'to-brand-500');
            btn.classList.add('from-emerald-600', 'to-emerald-500');
            btn.classList.add('text-white');
            btn.innerHTML = `<svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Submitted Successfully`;
            setTimeout(() => {
                e.target.reset();
                btn.classList.remove('from-emerald-600', 'to-emerald-500', 'text-white');
                btn.classList.add('from-brand-600', 'to-brand-500');
                btn.innerHTML = originalText;
            }, 2000);
        }, 1500);
    });

    // Auto-fill today's date
    document.querySelector('input[type="date"]').valueAsDate = new Date();
</script>
</body>
</html>
