<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RideX - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .logo span { color: #f5c842; }

        .subtitle {
            text-align: center;
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .role-toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #0a0a0a;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .role-btn {
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            color: #aaaaaa;
            transition: all 0.2s;
        }

        .role-btn.active {
            background: #f5c842;
            color: #000;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #aaaaaa;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #333333;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
            transition: border 0.2s;
            background: #0a0a0a;
            color: #ffffff;
        }
        input:focus { border-color: #f5c842; }

        .btn {
            width: 100%;
            padding: 14px;
            background: #f5c842;
            color: #000;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }

        .bottom-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #aaaaaa;
        }

        .bottom-link a {
            color: #f5c842;
            font-weight: 600;
            text-decoration: none;
        }

        .error {
            background: #fff0f0;
            border: 1px solid #ffcccc;
            color: #cc0000;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .success {
            background: #f0fff4;
            border: 1px solid #b2f5c8;
            color: #007a33;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">Ride<span>X</span></div>
    <div class="subtitle">Sign in to your account</div>

    <!-- Error / Success messages from Spring -->
    <div class="error" th:if="${error}" th:text="${error}"></div>
    <div class="success" th:if="${success}" th:text="${success}"></div>

    <!-- Role Toggle -->
    <div class="role-toggle">
        <button class="role-btn active" id="btn-passenger"
                onclick="setRole('PASSENGER')">
            Passenger
        </button>
        <button class="role-btn" id="btn-driver"
                onclick="setRole('DRIVER')">
            Driver
        </button>
    </div>

    <!-- Login Form -->
    <form action="/login" method="post">
        <input type="hidden" id="roleInput" name="role" value="PASSENGER"/>

        <label>Email Address</label>
        <input type="email" name="email"
               placeholder="you@example.com" required/>

        <label>Password</label>
        <input type="password" name="password"
               placeholder="••••••••" required/>

        <button type="submit" class="btn">Sign In</button>
    </form>

    <div class="bottom-link">
        Don't have an account?
        <a href="/register">Create one</a>
    </div>
</div>

<script>
    function setRole(role) {
        document.getElementById('roleInput').value = role;
        document.getElementById('btn-passenger')
            .classList.toggle('active', role === 'PASSENGER');
        document.getElementById('btn-driver')
            .classList.toggle('active', role === 'DRIVER');
    }
</script>

</body>
</html>
