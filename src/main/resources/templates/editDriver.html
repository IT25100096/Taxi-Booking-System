<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Driver</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a1a; color: #fff; }
        .navbar { background-color: #f5c518 !important; }
        .navbar-brand { color: #000 !important; font-size: 1.5rem; font-weight: 900; }
        .nav-btn { background-color: #000; color: #f5c518 !important; border: none; border-radius: 8px; padding: 6px 16px; margin-left: 8px; font-weight: 600; text-decoration: none; }
        .nav-btn:hover { background-color: #333; color: #f5c518 !important; }
        .edit-card { background-color: #2a2a2a; border-radius: 16px; padding: 36px; border: 2px solid #f5c518; max-width: 600px; margin: auto; }
        .edit-title { color: #f5c518; font-weight: 900; font-size: 1.5rem; margin-bottom: 24px; }
        .form-label { color: #f5c518; font-weight: 600; }
        .form-control, .form-select { background-color: #1a1a1a; color: #fff; border: 1px solid #f5c518; border-radius: 8px; }
        .form-control:focus, .form-select:focus { background-color: #1a1a1a; color: #fff; border-color: #f5c518; box-shadow: 0 0 0 0.2rem rgba(245,197,24,0.25); }
        .form-select option { background-color: #1a1a1a; color: #fff; }
        .btn-update { background-color: #f5c518; color: #000; font-weight: 700; border: none; border-radius: 8px; padding: 10px 28px; }
        .btn-update:hover { background-color: #e6a800; color: #000; }
        .btn-cancel { background-color: transparent; color: #f5c518; font-weight: 700; border: 2px solid #f5c518; border-radius: 8px; padding: 10px 28px; text-decoration: none; }
        .btn-cancel:hover { background-color: #f5c518; color: #000; }
    </style>
</head>
<body>

<nav class="navbar px-4 py-3">
    <span class="navbar-brand">🚖 TaxiAdmin Panel</span>
    <div>
        <a href="/" class="nav-btn">🏠 Dashboard</a>
        <a href="/fleet" class="nav-btn">🚗 Fleet</a>
        <a href="/logs" class="nav-btn">📋 Logs</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="edit-card">
        <div class="edit-title">✏️ Edit Driver Details</div>

        <form th:action="@{/driver/update}" th:object="${driver}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" th:field="*{name}" class="form-control" required/>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" th:field="*{phone}" class="form-control" required/>
            </div>

            <div class="mb-3">
                <label class="form-label">License Number</label>
                <input type="text" th:field="*{licenseNumber}" class="form-control" required/>
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>
                <select th:field="*{status}" class="form-select">
                    <option value="active">Active</option>
                    <option value="suspended">Suspended</option>
                </select>
            </div>

            <div class="d-flex gap-3 mt-4">
                <button type="submit" class="btn-update">💾 Update Driver</button>
                <a href="/fleet" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
