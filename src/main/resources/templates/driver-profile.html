<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RideX - Driver Profile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
        }

        .navbar {
            background: #000000;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f5c842;
        }

        .navbar .logo {
            font-size: 24px;
            font-weight: 800;
            color: white;
        }

        .navbar .logo span { color: #f5c842; }

        .navbar .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .navbar a {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
        }

        .navbar a:hover { color: #f5c842; }

        .logout-btn {
            background: #f5c842;
            color: #000 !important;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600 !important;
        }

        .main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .profile-header {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
            color: #f5c842;
            flex-shrink: 0;
        }

        .profile-info h2 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .badge {
            display: inline-block;
            background: #1a1a2e;
            color: #f5c842;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-green {
            background: #f0fff4;
            color: #007a33;
            border: 1px solid #b2f5c8;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-left: 8px;
        }

        .profile-info p {
            color: #888;
            font-size: 14px;
            margin-top: 6px;
        }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .stat-card .num {
            font-size: 28px;
            font-weight: 800;
            color: #f5c842;
        }

        .stat-card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }

        .card {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f5c842;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #aaaaaa;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #333333;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
            transition: border 0.2s;
            background: #0a0a0a;
            color: #ffffff;
        }

        input:focus, select:focus { border-color: #f5c842; }
        input:disabled { background: #f8f8f8; color: #999; }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .btn {
            padding: 12px 28px;
            background: #f5c842;
            color: #000;
            font-size: 14px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn:hover { opacity: 0.9; }

        .btn-danger {
            background: #fff0f0;
            color: #cc0000;
            border: 1px solid #ffcccc;
        }

        .btn-danger:hover {
            background: #cc0000;
            color: white;
        }

        .success {
            background: #f0fff4;
            border: 1px solid #b2f5c8;
            color: #007a33;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .danger-zone {
            border: 1px solid #ffcccc;
        }

        .danger-zone .card-title {
            color: #cc0000;
            border-bottom-color: #ffcccc;
        }
