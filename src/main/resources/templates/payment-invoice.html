<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Invoice</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #1a1a1a; color: #ffffff; }
        .card { background-color: #2d2d2d; border: 1px solid #FFC107; }
        .card-header { background-color: #000000; color: #FFC107; }
        .table { color: #ffffff; }
        .table td { border-color: #3a3a3a; }
        .table-success { background-color: #3a3a3a !important; color: #FFC107 !important; }
        .text-muted { color: #aaaaaa !important; }
        .form-control {
            background-color: #3a3a3a; color: #ffffff; border-color: #FFC107;
        }
        .form-control:focus {
            background-color: #3a3a3a; color: #ffffff;
            border-color: #FFC107; box-shadow: 0 0 0 0.2rem rgba(255,193,7,0.25);
        }
        .btn-outline-primary { border-color: #FFC107; color: #FFC107; }
        .btn-outline-primary:hover { background-color: #FFC107; color: #000000; }
        .btn-secondary { background-color: #3a3a3a; border-color: #6c757d; color: #ffffff; }
        .btn-secondary:hover { background-color: #FFC107; border-color: #FFC107; color: #000000; }
        hr { border-color: #FFC107; }
        h6 { color: #FFC107; }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="card shadow" style="max-width:550px;margin:auto">
        <div class="card-header text-center py-3">
            <h4 class="mb-0">🧾 Payment Invoice</h4>
        </div>
        <div class="card-body p-4">
            <table class="table table-sm">
                <tr>
                    <td class="text-muted">Payment ID</td>
                    <td><strong th:text="${paymentId}"></strong></td>
                </tr>
                <tr>
                    <td class="text-muted">Trip ID</td>
                    <td th:text="${tripId}"></td>
                </tr>
                <tr>
                    <td class="text-muted">Passenger ID</td>
                    <td th:text="${passengerId}"></td>
                </tr>
                <tr>
                    <td class="text-muted">Distance</td>
                    <td th:text="${distanceKm} + ' km'"></td>
                </tr>
                <tr>
                    <td class="text-muted">Payment Type</td>
                    <td th:text="${type}"></td>
                </tr>
                <tr>
                    <td class="text-muted">Promo Code</td>
                    <td th:text="${promoCode} != null ? ${promoCode} : 'None'"></td>
                </tr>
                <tr>
                    <td class="text-muted">Discount</td>
                    <td th:text="'Rs. ' + ${discount}"></td>
                </tr>
                <tr class="table-success">
                    <td><strong>Total Amount</strong></td>
                    <td><strong th:text="'Rs. ' + ${total}"></strong></td>
                </tr>
                <tr>
                    <td class="text-muted">Status</td>
                    <td>
                        <span th:text="${status}"
                              th:class="${status == 'COMPLETED'} ? 'badge bg-success' : 'badge bg-warning text-dark'">
                        </span>
                    </td>
                </tr>
                <tr>
                    <td class="text-muted">Date</td>
                    <td th:text="${createdAt}"></td>
                </tr>
            </table>
            <hr>
            <h6>Apply Promo Code</h6>
            <form th:action="@{/payments/update}" method="post">
                <input type="hidden" name="paymentId" th:value="${paymentId}">
                <input type="hidden" name="newFare" th:value="${total}">
                <input type="hidden" name="discount" th:value="${discount}">
                <div class="input-group mb-3">
                    <input name="promoCode" class="form-control"
                           placeholder="Enter promo code (TAXI10 / SAVE20 / FIRST50)">
                    <button class="btn btn-outline-primary">Apply</button>
                </div>
            </form>
            <a href="/payments/history" class="btn btn-secondary w-100">
                ← Back to History
            </a>
        </div>
    </div>
</div>
</body>
</html>
