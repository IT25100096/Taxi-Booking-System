<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Payment History</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #1a1a1a; color: #ffffff; }
        .card { background-color: #2d2d2d; border: 1px solid #FFC107; }
        h3 { color: #FFC107; }
        .table { color: #ffffff; }
        .table-dark { background-color: #000000; }
        .table-hover tbody tr:hover { background-color: #3a3a3a; color: #FFC107; }
        .btn-success { background-color: #FFC107; border-color: #FFC107; color: #000000; font-weight: bold; }
        .btn-success:hover { background-color: #e0a800; border-color: #e0a800; }
        .btn-info { background-color: #2d2d2d; border-color: #FFC107; color: #FFC107; }
        .btn-info:hover { background-color: #FFC107; color: #000000; }
        .btn-danger { background-color: #dc3545; border-color: #dc3545; }
        tbody tr { border-bottom: 1px solid #3a3a3a; }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>🚖 Payment History</h3>
        <a href="/payments/new" class="btn btn-success">+ New Payment</a>
    </div>
    <div class="card shadow">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Payment ID</th>
                    <th>Trip ID</th>
                    <th>Passenger</th>
                    <th>Distance</th>
                    <th>Amount (LKR)</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${payments}">
                    <td th:text="${p.paymentId}"></td>
                    <td th:text="${p.tripId}"></td>
                    <td th:text="${p.passengerId}"></td>
                    <td th:text="${p.distanceKm} + ' km'"></td>
                    <td th:text="'Rs. ' + ${p.finalAmount}"></td>
                    <td>
                            <span th:text="${p.type}"
                                  th:class="${p.type == 'CASH'} ? 'badge bg-secondary' : 'badge bg-warning text-dark'">
                            </span>
                    </td>
                    <td>
                            <span th:text="${p.status}"
                                  th:class="${p.status == 'COMPLETED'} ? 'badge bg-success' : 'badge bg-warning text-dark'">
                            </span>
                    </td>
                    <td>
                        <a th:href="@{/payments/invoice/{id}(id=${p.paymentId})}"
                           class="btn btn-sm btn-info">Invoice</a>
                        <form th:action="@{/payments/delete}" method="post" style="display:inline">
                            <input type="hidden" name="paymentId" th:value="${p.paymentId}">
                            <button class="btn btn-sm btn-danger"
                                    onclick="return confirm('Delete this payment?')">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
