<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>System Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a1a; color: #fff; }
        .navbar { background-color: #f5c518 !important; }
        .navbar-brand { color: #000 !important; font-size: 1.5rem; font-weight: 900; }
        .nav-btn { background-color: #000; color: #f5c518 !important; border: none; border-radius: 8px; padding: 6px 16px; margin-left: 8px; font-weight: 600; text-decoration: none; }
        .nav-btn:hover { background-color: #333; color: #f5c518 !important; }
        .logs-card { background-color: #2a2a2a; border-radius: 16px; padding: 24px; border: 1px solid #f5c518; }
        .page-title { color: #f5c518; font-weight: 900; font-size: 1.8rem; }
        .section-title { color: #f5c518; font-weight: 800; font-size: 1.2rem; margin-bottom: 20px; }
        .back-btn { background-color: #f5c518; color: #000; font-weight: 700; border: none; border-radius: 8px; padding: 10px 24px; text-decoration: none; display: inline-block; margin-top: 20px; }
        .back-btn:hover { background-color: #e6a800; color: #000; }
        .custom-table { width: 100%; border-collapse: collapse; }
        .custom-table thead tr th { background-color: #f5c518; color: #000; padding: 12px; text-align: left; }
        .custom-table tbody tr { background-color: #1a1a1a; border-bottom: 1px solid #444; }
        .custom-table tbody tr:hover { background-color: #2c2c2c; }
        .custom-table tbody tr td { color: #fff; padding: 12px; }
        .empty-msg { color: #888; text-align: center; padding: 30px; font-size: 1.1rem; }
    </style>
</head>
<body>

<nav class="navbar px-4 py-3">
    <span class="navbar-brand">🚖 TaxiAdmin Panel</span>
    <div>
        <a href="/" class="nav-btn">🏠 Dashboard</a>
        <a href="/fleet" class="nav-btn">🚗 Fleet</a>
        <a href="/logs" class="nav-btn">📋 Logs</a>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="page-title mb-4">📋 System Activity Logs</h2>

    <div class="logs-card">
        <div class="section-title">🕒 All Admin Actions</div>
        <table class="custom-table">
            <thead>
            <tr>
                <th>#</th>
                <th>Action</th>
                <th>Date and Time</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="log : ${logs}">
                <td th:text="${log.id}"></td>
                <td th:text="${log.action}"></td>
                <td th:text="${log.performedAt}"></td>
            </tr>
            </tbody>
        </table>
        <p th:if="${logs.empty}" class="empty-msg">
            No logs yet. Start managing your fleet!
        </p>
    </div>

    <a href="/" class="back-btn">🏠 Back to Dashboard</a>
</div>

</body>
</html>
