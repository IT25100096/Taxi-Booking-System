<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>System Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand fw-bold">🚖 TaxiAdmin Panel</span>
    <div>
        <a href="/" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
        <a href="/fleet" class="btn btn-outline-light btn-sm me-2">Fleet</a>
        <a href="/logs" class="btn btn-outline-light btn-sm">Logs</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-secondary text-white fw-bold">
            System Activity Logs
        </div>
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Action</th>
                    <th>Date & Time</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="log : ${logs}">
                    <td th:text="${log.id}"></td>
                    <td th:text="${log.action}"></td>
                    <td th:text="${log.performedAt}"></td>
                </tr>
                </tbody>
            </table>
            <div th:if="${#lists.isEmpty(logs)}" class="text-center text-muted mt-3">
                No logs yet. Start managing your fleet!
            </div>
        </div>
    </div>
    <a href="/" class="btn btn-dark mt-3">Back to Dashboard</a>
</div>

</body>
</html>
