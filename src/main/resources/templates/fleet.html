<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fleet Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand fw-bold">🚖 TaxiAdmin Panel</span>
    <div>
        <a href="/" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
        <a href="/fleet" class="btn btn-outline-light btn-sm me-2">Fleet</a>
        <a href="/logs" class="btn btn-outline-light btn-sm">Logs</a>
    </div>
</nav>

<div class="container mt-4">

    <!-- Add Driver Form -->
    <div class="card shadow mb-4">
        <div class="card-header bg-primary text-white">Add New Driver</div>
        <div class="card-body">
            <form th:action="@{/driver/add}" th:object="${newDriver}" method="post" class="row g-3">
                <div class="col-md-3">
                    <input type="text" th:field="*{name}" class="form-control" placeholder="Full Name" required/>
                </div>
                <div class="col-md-3">
                    <input type="text" th:field="*{phone}" class="form-control" placeholder="Phone Number" required/>
                </div>
                <div class="col-md-3">
                    <input type="text" th:field="*{licenseNumber}" class="form-control" placeholder="License Number" required/>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100">Add Driver</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Drivers Table -->
    <div class="card shadow mb-4">
        <div class="card-header bg-dark text-white">All Drivers</div>
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>License</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="driver : ${drivers}">
                    <td th:text="${driver.id}"></td>
                    <td th:text="${driver.name}"></td>
                    <td th:text="${driver.phone}"></td>
                    <td th:text="${driver.licenseNumber}"></td>
                    <td>
                            <span th:text="${driver.status}"
                                  th:class="${driver.status == 'active'} ? 'badge bg-success' : 'badge bg-danger'">
                            </span>
                    </td>
                    <td>
                        <a th:href="@{/driver/edit/{id}(id=${driver.id})}"
                           class="btn btn-warning btn-sm me-1">Edit</a>
                        <a th:href="@{/driver/delete/{id}(id=${driver.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Vehicle Form -->
    <div class="card shadow mb-4">
        <div class="card-header bg-success text-white">Add New Vehicle</div>
        <div class="card-body">
            <form th:action="@{/vehicle/add}" th:object="${newVehicle}" method="post" class="row g-3">
                <div class="col-md-3">
                    <input type="number" th:field="*{driverId}" class="form-control" placeholder="Driver ID" required/>
                </div>
                <div class="col-md-3">
                    <input type="text" th:field="*{model}" class="form-control" placeholder="Car Model" required/>
                </div>
                <div class="col-md-3">
                    <input type="text" th:field="*{plateNumber}" class="form-control" placeholder="Plate Number" required/>
                </div>
                <div class="col-md-3">
                    <select th:field="*{vehicleType}" class="form-select">
                        <option value="Sedan">Sedan</option>
                        <option value="SUV">SUV</option>
                        <option value="Van">Van</option>
                        <option value="Tuk-Tuk">Tuk-Tuk</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-success w-100">Add Vehicle</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Vehicles Table -->
    <div class="card shadow mb-4">
        <div class="card-header bg-dark text-white">All Vehicles</div>
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Driver ID</th>
                    <th>Model</th>
                    <th>Plate Number</th>
                    <th>Type</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="vehicle : ${vehicles}">
                    <td th:text="${vehicle.id}"></td>
                    <td th:text="${vehicle.driverId}"></td>
                    <td th:text="${vehicle.model}"></td>
                    <td th:text="${vehicle.plateNumber}"></td>
                    <td th:text="${vehicle.vehicleType}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
