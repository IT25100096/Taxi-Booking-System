<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a1a; color: #fff; }
        .navbar { background-color: #f5c518 !important; }
        .navbar-brand { color: #000 !important; font-size: 1.5rem; font-weight: 900; }
        .nav-btn { background-color: #000; color: #f5c518 !important; border: none; border-radius: 8px; padding: 6px 16px; margin-left: 8px; font-weight: 600; text-decoration: none; }
        .nav-btn:hover { background-color: #333; color: #f5c518 !important; }
        .stat-card { border-radius: 16px; padding: 30px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.4); transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-6px); }
        .card-drivers { background: linear-gradient(135deg, #f5c518, #e6a800); color: #000; }
        .card-vehicles { background: linear-gradient(135deg, #2c2c2c, #444); color: #f5c518; border: 2px solid #f5c518; }
        .card-logs { background: linear-gradient(135deg, #f5c518, #ffd700); color: #000; }
        .stat-number { font-size: 3rem; font-weight: 900; }
        .stat-label { font-size: 1rem; font-weight: 600; margin-top: 8px; }
        .stat-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .welcome-text { font-size: 2rem; font-weight: 800; color: #f5c518; }
        .action-btn { background-color: #f5c518; color: #000; font-weight: 700; border: none; padding: 12px 30px; border-radius: 10px; font-size: 1rem; margin-right: 10px; text-decoration: none; }
        .action-btn:hover { background-color: #e6a800; color: #000; }
        .action-btn-outline { background-color: transparent; color: #f5c518; font-weight: 700; border: 2px solid #f5c518; padding: 12px 30px; border-radius: 10px; font-size: 1rem; text-decoration: none; }
        .action-btn-outline:hover { background-color: #f5c518; color: #000; }
    </style>
</head>
<body>

<nav class="navbar px-4 py-3">
    <span class="navbar-brand">🚖 TaxiAdmin Panel</span>
    <div>
        <a href="/" class="nav-btn">🏠 Dashboard</a>
        <a href="/fleet" class="nav-btn">🚗 Fleet</a>
        <a href="/logs" class="nav-btn">📋 Logs</a>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="welcome-text mb-1">Welcome, Admin 👋</h2>
    <p class="text-secondary mb-5">Here is your fleet overview for today.</p>

    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="stat-card card-drivers">
                <div class="stat-icon">🧑‍✈️</div>
                <div class="stat-number" th:text="${driverCount}">0</div>
                <div class="stat-label">Total Drivers</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card card-vehicles">
                <div class="stat-icon">🚗</div>
                <div class="stat-number" th:text="${vehicleCount}">0</div>
                <div class="stat-label">Total Vehicles</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card card-logs">
                <div class="stat-icon">📋</div>
                <div class="stat-number" th:text="${logCount}">0</div>
                <div class="stat-label">Total Actions Logged</div>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a href="/fleet" class="action-btn">🚗 Manage Fleet</a>
        <a href="/logs" class="action-btn-outline">📋 View Logs</a>
    </div>
</div>

</body>
</html>
