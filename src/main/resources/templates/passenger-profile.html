<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RideX - My Profile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
        }

        /* Top Navigation Bar */
        .navbar {
            background: #000000;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f5c842;
        }

        .navbar .logo {
            font-size: 24px;
            font-weight: 800;
            color: white;
        }

        .navbar .logo span { color: #f5c842; }

        .navbar .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .navbar a {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
        }

        .navbar a:hover { color: #f5c842; }

        .logout-btn {
            background: #f5c842;
            color: #000 !important;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600 !important;
        }

        /* Main Content */
        .main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Profile Header Card */
        .profile-header {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #f5c842;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
            color: #000;
            flex-shrink: 0;
        }

        .profile-info h2 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .badge {
            display: inline-block;
            background: #f5c842;
            color: #000;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .profile-info p {
            color: #888;
            font-size: 14px;
            margin-top: 4px;
        }

        /* Settings Card */
        .card {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f5c842;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #aaaaaa;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #333333;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
            transition: border 0.2s;
            background: #0a0a0a;
            color: #ffffff;
        }

        input:focus, select:focus {
            border-color: #f5c842;
        }

        input:disabled {
            background: #f8f8f8;
            color: #999;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .btn {
            padding: 12px 28px;
            background: #f5c842;
            color: #000;
            font-size: 14px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn:hover { opacity: 0.9; }

        .btn-danger {
            background: #fff0f0;
            color: #cc0000;
            border: 1px solid #ffcccc;
        }

        .btn-danger:hover {
            background: #cc0000;
            color: white;
        }

        .success {
            background: #f0fff4;
            border: 1px solid #b2f5c8;
            color: #007a33;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .danger-zone {
            border: 1px solid #ffcccc;
        }

        .danger-zone .card-title {
            color: #cc0000;
            border-bottom-color: #ffcccc;
        }
    </style>
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar">
    <div class="logo">Ride<span>X</span></div>
    <div class="nav-links">
        <a href="/passenger/profile">My Profile</a>
        <a href="/logout" class="logout-btn">Sign Out</a>
    </div>
</nav>

<div class="main">

    <!-- Profile Header -->
    <div class="profile-header">
        <div class="avatar"
             th:text="${#strings.toUpperCase(#strings.substring(user.fullName, 0, 1))}">
        </div>
        <div class="profile-info">
            <h2 th:text="${user.fullName}">Name</h2>
            <span class="badge">Passenger</span>
            <p th:text="${user.email}">email</p>
        </div>
    </div>

    <!-- Success Message -->
    <div class="success" th:if="${success}" th:text="${success}"></div>

    <!-- Edit Profile Form -->
    <div class="card">
        <div class="card-title">Personal Information</div>
        <form action="/profile/update" method="post">

            <div class="grid-2">
                <div>
                    <label>Full Name</label>
                    <input type="text" name="fullName"
                           th:value="${user.fullName}" required/>
                </div>
                <div>
                    <label>Phone Number</label>
                    <input type="tel" name="phone"
                           th:value="${user.phone}" required/>
                </div>
            </div>

            <label>Email Address (cannot change)</label>
            <input type="email" th:value="${user.email}" disabled/>

            <label>Home Address</label>
            <input type="text" name="homeAddress"
                   th:value="${user.homeAddress}"
                   placeholder="Your home address"/>

            <label>Default Payment Method</label>
            <select name="paymentMethod">
                <option value="CASH"
                        th:selected="${user.paymentMethod == 'CASH'}">
                    Cash
                </option>
                <option value="CARD"
                        th:selected="${user.paymentMethod == 'CARD'}">
                    Card
                </option>
                <option value="WALLET"
                        th:selected="${user.paymentMethod == 'WALLET'}">
                    Wallet
                </option>
            </select>

            <button type="submit" class="btn">Save Changes</button>
        </form>
    </div>

    <!-- Danger Zone -->
    <div class="card danger-zone">
        <div class="card-title">Danger Zone</div>
        <p style="font-size:14px;color:#888;margin-bottom:16px;">
            Deactivating your account will log you out
            and disable your access.
        </p>
        <form action="/account/delete" method="post"
              onsubmit="return confirm('Are you sure?')">
            <button type="submit" class="btn btn-danger">
                Deactivate Account
            </button>
        </form>
    </div>

</div>
</body>
</html>
