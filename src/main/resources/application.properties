spring.application.name=TaxiAdmin
spring.datasource.url=jdbc:mysql://localhost:3306/taxi_db
spring.datasource.username=root
spring.datasource.password=1111
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Change this back to 'update' AFTER the first successful run
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Remove the old dialect line and use this if needed,
# though Spring 4+ usually handles it automatically
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
